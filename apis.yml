aid: fiberplane
name: Fiberplane
description: >-
  Fiberplane is an Amsterdam-founded developer-tools company, backed by Northzone,
  building agent-native tooling for the "software factory" era of AI coding agents.
  Its current lineup centers on fp (fp.dev), a local-first CLI for tracking work
  when coding with AI agents such as Claude Code; EV, an AI-powered code-review tool
  that turns diffs into narratives; and DRIFT, an open-source tool that binds
  specifications to code and lints for drift before stale docs reach production.
  Fiberplane also maintains a Model Context Protocol (MCP) toolchain — mcp-lite (a
  small, fetch-first SDK for building MCP servers), an MCP Gateway for intercepting
  and debugging MCP servers, and a Console for reviewing and evaluating MCP servers.
  Earlier work includes the Hono-native API Playground/Studio, the HONC.dev stack
  (create-honc-app), @fiberplane/agents for introspecting Cloudflare Agents SDK apps,
  and collaborative observability notebooks for incident response. The company ships
  its libraries on npm under the @fiberplane scope and distributes its CLI binaries
  via a Homebrew tap and an install script.
